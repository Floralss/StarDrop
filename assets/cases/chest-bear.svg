  <rect x="48" y="205" width="184" height="8" fill="#143020" stroke="#3d7a4a" stroke-width="1"/>
  <rect x="118" y="155" width="44" height="40" rx="6" fill="#1a3d28" stroke="#4ade80" stroke-width="2"/>
