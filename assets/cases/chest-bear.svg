<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3d28"/><stop offset="50%" stop-color="#0f2418"/><stop offset="100%" stop-color="#08140c"/>
    </linearGradient>
    <linearGradient id="al" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a5a3a"/><stop offset="100%" stop-color="#1a3824"/>
    </linearGradient>
    <filter id="aglow"><feGaussianBlur stdDeviation="8"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="asoft"><feGaussianBlur stdDeviation="16"/></filter>
    <radialGradient id="afloor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.55"/><stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="140" cy="255" rx="115" ry="20" fill="url(#afloor)" filter="url(#asoft)"/>
