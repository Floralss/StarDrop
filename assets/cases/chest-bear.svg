  <ellipse cx="140" cy="112" rx="12" ry="5" fill="#2a5a3a" stroke="#4ade80"/>
  <rect x="95" y="188" width="90" height="22" rx="4" fill="#0a150e" stroke="#3d8a4a" stroke-width="1.5"/>
  <text x="140" y="204" text-anchor="middle" fill="#86efac" font-family="Arial Black,Arial,sans-serif" font-size="10" font-weight="900" letter-spacing="1">ANIMAL'S</text>
  <!-- animals peeking -->
