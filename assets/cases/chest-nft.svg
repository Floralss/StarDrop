<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <linearGradient id="vg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1528"/><stop offset="40%" stop-color="#0d0a14"/><stop offset="100%" stop-color="#050308"/>
    </linearGradient>
    <linearGradient id="vl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2040"/><stop offset="100%" stop-color="#151020"/>
    </linearGradient>
    <linearGradient id="vm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d2d5c"/><stop offset="100%" stop-color="#1a1228"/>
    </linearGradient>
    <filter id="gglow"><feGaussianBlur stdDeviation="8"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <radialGradient id="floor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.5"/><stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- green floor glow -->
  <ellipse cx="140" cy="255" rx="110" ry="18" fill="url(#floor)" filter="url(#soft)"/>
  <!-- chest body -->
  <rect x="48" y="110" width="184" height="120" rx="16" fill="url(#vg)" stroke="#3d2d5c" stroke-width="3"/>
  <!-- wood panel lines -->
  <path d="M60 140 H220 M60 170 H220 M60 200 H220" stroke="#2a2040" stroke-width="1.5" opacity="0.6"/>
  <!-- metal bands -->
  <rect x="48" y="125" width="184" height="8" fill="#1e1530" stroke="#4a3a6a" stroke-width="1"/>
  <rect x="48" y="205" width="184" height="8" fill="#1e1530" stroke="#4a3a6a" stroke-width="1"/>
  <!-- lock -->
  <rect x="118" y="155" width="44" height="40" rx="6" fill="#2a1f40" stroke="#5b4a8a" stroke-width="2"/>
  <circle cx="140" cy="172" r="8" fill="none" stroke="#8b7ab8" stroke-width="2.5"/>
  <rect x="136" y="172" width="8" height="12" rx="1" fill="#8b7ab8"/>
  <!-- lid (slightly open) -->
  <path d="M45 115 Q140 55 235 115 L220 125 Q140 75 60 125 Z" fill="url(#vl)" stroke="#4a3a6a" stroke-width="3"/>
  <path d="M60 115 Q140 70 220 115" fill="none" stroke="#6b5b95" stroke-width="2" opacity="0.5"/>
  <!-- hinge -->
  <ellipse cx="140" cy="112" rx="12" ry="5" fill="#3d2d5c" stroke="#5b4a8a"/>
  <!-- brand plate -->
  <rect x="95" y="188" width="90" height="22" rx="4" fill="#12101c" stroke="#5b4a8a" stroke-width="1.5"/>
  <text x="140" y="204" text-anchor="middle" fill="#a78bfa" font-family="Arial Black,Arial,sans-serif" font-size="11" font-weight="900" letter-spacing="2">VILLIAN</text>
  <!-- floating items with green glow -->
  <g filter="url(#gglow)">
    <!-- green eye orb -->
    <circle cx="95" cy="85" r="14" fill="#0a1a0a" stroke="#22c55e" stroke-width="2"/>
    <circle cx="95" cy="85" r="6" fill="#4ade80"/>
    <circle cx="97" cy="83" r="2" fill="#fff" opacity="0.8"/>
    <!-- skull -->
    <circle cx="140" cy="70" r="12" fill="#e8e0d0"/>
    <circle cx="135" cy="68" r="2.5" fill="#1a1528"/>
    <circle cx="145" cy="68" r="2.5" fill="#1a1528"/>
    <path d="M136 76 Q140 80 144 76" stroke="#1a1528" stroke-width="1.5" fill="none"/>
    <!-- mushroom -->
    <ellipse cx="185" cy="78" rx="12" ry="8" fill="#22c55e"/>
    <rect x="181" y="78" width="8" height="14" rx="2" fill="#d4a574"/>
    <circle cx="180" cy="76" r="2" fill="#fff" opacity="0.6"/>
    <circle cx="188" cy="74" r="1.5" fill="#fff" opacity="0.5"/>
    <!-- crystal -->
    <path d="M160 95 L168 80 L176 95 Z" fill="#a78bfa" opacity="0.9"/>
  </g>
</svg>