<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b2d6e"/><stop offset="100%" stop-color="#1a1235"/>
    </linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#3b2d6e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <ellipse cx="110" cy="185" rx="80" ry="12" fill="#7c3aed" opacity="0.45" filter="url(#soft)"/>
  <!-- body -->
  <rect x="40" y="78" width="140" height="92" rx="14" fill="url(#b)" stroke="#8b5cf6" stroke-width="2.5"/>
  <rect x="50" y="88" width="120" height="72" rx="8" fill="#0a0a12" opacity="0.4"/>
  <!-- lock -->
  <rect x="95" y="112" width="30" height="26" rx="5" fill="#3b2d6e" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="110" cy="122" r="5" fill="#c4b5fd"/>
  <rect x="107.5" y="122" width="5" height="9" rx="1" fill="#c4b5fd" opacity="0.8"/>
  <!-- lid -->
  <path d="M35 80 Q110 42 185 80 L172 88 Q110 56 48 88 Z" fill="url(#l)" stroke="#8b5cf6" stroke-width="2.5"/>
  <path d="M48 80 Q110 52 172 80" fill="none" stroke="#c4b5fd" stroke-width="1.2" opacity="0.35"/>
  <!-- brand name -->
  <text x="110" y="158" text-anchor="middle" fill="#c4b5fd" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1">VILLIAN</text>
  <!-- floating gift icons -->
  <g filter="url(#glow)" font-size="18">
    <text x="48" y="58">💎</text>
    <text x="95" y="48">🕶️</text>
    <text x="145" y="55">🐸</text>
  </g>
</svg>